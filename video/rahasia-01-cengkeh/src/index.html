<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Rahasia 01 Cengkeh</title>
<link rel="stylesheet" href="kit.css">
<style>
.sc{position:absolute;inset:0;will-change:transform,opacity}
.sub{transition:none}
</style></head><body><div class="f" id="f"><img class="logo" src="logo-upg-transparan.png"><div id="stage"></div><div id="sub" class="sub"></div></div>
<script src="kit.js"></script>
<script>
// ===== Timeline (detik), diukur dari audio nyata audio/v1/L01..L10 =====
const LINES=[ // kartu subtitle (s = mulai, d = lama tampil), mengikuti audio v1 + v2
 {s:0.30,d:3.71,t:'Pernah sadar nggak, kenapa klinik gigi<br>selalu bau cengkeh?'},
 {s:4.60,d:5.72,t:'Di akun ini, kita bongkar hal-hal yang<br>dokter gigi tahu, tapi jarang diceritakan.'},
 {s:10.60,d:4.05,t:'Rahasia nomor satu:<br>bau itu namanya eugenol.'},
 {s:14.95,d:3.71,t:'Sebagian besar isi minyak cengkeh,<br>ya si eugenol ini.'},
 {s:18.95,d:2.40,t:'Kalau ada gigi berlubang<br>yang lagi nyeri,'},
 {s:21.35,d:3.01,t:'dokter gigi meneteskan eugenol<br>ke kapas kecil.'},
 {s:24.65,d:1.95,t:'Kapasnya dikeringkan sedikit,'},
 {s:26.60,d:2.41,t:'lalu diletakkan<br>di dalam lubang gigi.'},
 {s:29.30,d:2.77,t:'Setelah itu ditutup<br>tambalan sementara.'},
 {s:32.07,d:2.48,t:'Eugenol membantu<br>meredakan nyerinya.'},
 {s:34.85,d:1.58,t:'Nah, setiap kali dipakai,'},
 {s:36.43,d:3.57,t:'aromanya menyebar<br>ke ruangan.'},
 {s:40.00,d:1.85,t:'Itulah bau cengkeh<br>yang kamu cium.'},
 {s:42.25,d:3.16,t:'Rahasia nomor dua?<br>Kamu yang tentukan.'},
 {s:45.75,d:1.50,t:'Terus tulis di komen:'},
 {s:47.25,d:2.78,t:'rahasia dokter gigi apa lagi<br>yang pengen kamu tahu?'},
 {s:50.30,d:3.24,t:'Yang paling banyak diminta,<br>kita bongkar duluan.'},
 {s:53.80,d:2.04,t:'Follow biar nggak ketinggalan.'}];
const SC=[0,4.2,10.45,14.8,18.8,24.5,29.15,34.7,42.0,45.6];
const DURATION=57.0, STAMP1=4.42, STAMP3=40.0, STAMP4=44.1;
window.DURATION=DURATION;

// ===== easing =====
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const p=(t,s,d)=>cl((t-s)/d);
const o4=k=>1-Math.pow(1-k,4), i4=k=>Math.pow(k,4);
const back=k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const typed=(str,k)=>str.slice(0,Math.round(str.length*cl(k)));
const draw=(k,len=400)=>`stroke-dasharray:${len};stroke-dashoffset:${len*(1-cl(k))}`;
const pop=(k)=>`transform:scale(${0.55+0.45*back(cl(k))});opacity:${cl(k*3)}`;

// ===== adegan (lt = waktu lokal sejak awal adegan) =====
const scenes=[
// 1 HOOK: teks diketik, asap cengkeh naik
lt=>{const q='Kenapa klinik gigi selalu bau ';
 return `${folderBlock('BERKAS #01')}
 <div class="paper" style="left:120px;right:180px;top:530px;height:720px">
  <div class="typed" style="margin-bottom:22px">RAHASIA KURSI DOKTER GIGI</div>
  <div class="h">${typed(q,p(lt,0,0.75))}${lt>0.75?`<span class="pill" style="display:inline-block;${pop(p(lt,0.75,0.3))}">cengkeh?</span>`:''}</div></div>
 <svg class="abs" style="left:150px;top:1010px" width="620" height="230">
  <g transform="translate(0,${-((lt*40)%30)})" opacity="${.5+.2*Math.sin(lt*3)}">${wisp(130,120,.6)}${wisp(230,130,.5)}</g>${clove(130,170,.55)}${clove(230,180,.5)}</svg>`;},
// 2 STEMPEL: tangan turun, dug, kamera sedikit mendorong
lt=>{const imp=STAMP1-SC[1], down=p(lt,0,imp), up=p(lt,imp+0.35,0.5);
 const hy=-260*(1-o4(down))-220*o4(up), hit=lt>=imp;
 const shake=hit&&lt<imp+0.12?Math.sin((lt-imp)*120)*5:0, push=1+0.035*p(lt,imp,5);
 return `<div class="sc" style="transform:scale(${push}) translate(${shake}px,0);transform-origin:50% 45%">${folderBlock('BERKAS #01')}
 ${hit?`<div class="stamp" style="left:190px;top:700px;font-size:74px;transform:rotate(-7deg) scale(${1+0.08*(1-p(lt,imp,0.15))})">RAHASIA KURSI<br>DOKTER GIGI</div>`:''}
 <div class="cap" style="top:1000px;text-align:center;color:${C.coklat};opacity:${p(lt,imp+0.6,0.4)};transform:translateY(${16*(1-o4(p(lt,imp+0.6,0.4)))}px)">Yang dokter gigi tahu,<br>tapi jarang diceritakan</div></div>
 <svg class="abs" style="left:300px;top:${520+hy}px;opacity:${1-p(lt,imp+0.6,0.3)}" width="400" height="360" viewBox="-160 -340 400 470">${stampHand(0,0,.8)}</svg>`;},
// 3 TEMUAN #1
lt=>{const up=o4(p(lt,0,0.45));
 return `${folderBlock('BERKAS #01')}
 <div class="paper" style="left:120px;right:180px;top:${530+120*(1-up)}px;height:720px">
  <div class="typed">${typed('TEMUAN #1',p(lt,0.2,0.4))}</div>
  <div class="h" style="margin-top:40px;opacity:${p(lt,1.9,0.25)}">Itu bau</div>
  <div class="h" style="margin-top:8px">${lt>2.95?`<span class="pill" style="display:inline-block;${pop(p(lt,2.95,0.3))}">eugenol</span>`:''}</div>
  <div class="typed" style="margin-top:60px;color:${C.gelap};font-size:30px">${typed('dibaca: eu-ge-nol',p(lt,3.3,0.6))}</div></div>`;},
// 4 cengkeh -> minyak -> eugenol
lt=>`<div class="h2 abs" style="left:80px;right:140px;top:460px;opacity:${p(lt,0,.3)}">Isi utama <span class="pill">minyak cengkeh</span></div>
 <svg class="abs" style="left:0;top:760px" width="960" height="560">
  <g style="${pop(p(lt,0.2,0.35))};transform-origin:190px 250px;transform-box:view-box">${clove(190,250,1)}</g>
  <g style="${draw(p(lt,0.8,0.4),220)}">${arrow(290,250,420)}</g>
  <g style="${pop(p(lt,1.15,0.35))};transform-origin:530px 260px;transform-box:view-box">${drop(530,260,1.5)}</g>
  <g style="${draw(p(lt,2.0,0.35),160)}">${arrow(630,250,715)}</g>
  <g style="${pop(p(lt,2.4,0.3))};transform-origin:843px 248px;transform-box:view-box"><rect x="730" y="196" width="226" height="104" rx="22" fill="${C.or}"/><text x="843" y="264" class="label" style="font-weight:900">eugenol</text></g>
  <text x="190" y="530" class="label" opacity="${p(lt,0.5,.3)}">cengkeh</text><text x="530" y="530" class="label" opacity="${p(lt,1.4,.3)}">minyaknya</text></svg>`,
// 5 eugenol diteteskan ke kapas
lt=>{const pip=o4(p(lt,0.1,0.6)), fall=p(lt,2.5,0.5), wet=o4(p(lt,3.0,0.5));
 return `<div class="h2 abs" style="left:80px;right:140px;top:460px;opacity:${p(lt,0,.3)}">Diteteskan ke ${lt>2.6?`<span class="pill" style="display:inline-block;${pop(p(lt,2.6,.3))}">kapas</span>`:'<span style="opacity:0">kapas</span>'}</div>
 <svg class="abs" style="left:0;top:700px" width="960" height="660">
  <g transform="translate(470,${40-160*(1-pip)}) rotate(8)"><rect x="-22" y="0" width="44" height="210" rx="10" fill="#fff" stroke="${C.gelap}" stroke-width="7"/><rect x="-16" y="${120+40*fall}" width="32" height="${84-40*fall}" rx="6" fill="${C.amber}" opacity=".85"/><path d="M-8 208 L0 250 L8 208" fill="#fff" stroke="${C.gelap}" stroke-width="7" stroke-linejoin="round"/><rect x="-34" y="-110" width="68" height="120" rx="30" fill="${C.ortua}" stroke="${C.gelap}" stroke-width="7" style="transform:scaleY(${lt>2.3&&lt<2.6?0.88:1});transform-origin:0 -50px;transform-box:view-box"/></g>
  ${lt>2.5&&lt<3.0?drop(440,330+140*fall*fall,.42):''}
  <g transform="translate(450,470)"><g style="${pop(p(lt,0.3,.35))}"><path d="M-95 20 C-120 -15 -85 -55 -50 -45 C-40 -80 10 -85 25 -55 C60 -75 105 -45 92 -10 C125 5 110 55 70 52 C55 80 -5 82 -25 58 C-60 75 -110 55 -95 20Z" fill="#fff" stroke="${C.gelap}" stroke-width="7"/><ellipse cx="0" cy="10" rx="${60*wet}" ry="${26*wet}" fill="${C.amber}" opacity=".55"/></g></g>
  <text x="450" y="620" class="label" opacity="${p(lt,0.8,.3)}">kapas kecil</text></svg>`;},
// 6 kapas dikeringkan, masuk ke lubang gigi
lt=>{const down=o4(p(lt,2.0,1.0)), sq=lt>0.6&&lt<1.6?0.82+0.18*Math.abs(Math.cos((lt-0.6)*Math.PI)):1;
 const cy=170+152*down;
 return `<div class="h2 abs" style="left:80px;right:140px;top:460px;opacity:${p(lt,0,.3)}">Diletakkan di ${lt>2.2?`<span class="pill" style="display:inline-block;${pop(p(lt,2.2,.3))}">lubang gigi</span>`:'<span style="opacity:0">lubang gigi</span>'}</div>
 <svg class="abs" style="left:0;top:690px" width="960" height="680">
  ${tooth(470,430,2.3,`<path d="M-30 -40 C-30 10 -22 60 -30 100 M30 -40 C30 10 22 60 30 100" stroke="${C.ortua}" stroke-width="5" fill="none" opacity=".5"/><path d="M-26 -62 L-18 -30 L18 -30 L26 -62 Z" fill="${C.krem}" stroke="${C.gelap}" stroke-width="5" stroke-linejoin="round"/>`)}
  <g transform="translate(470,${cy})"><g style="transform:scaleY(${sq});transform-box:view-box"><path d="M-34 0 C-42 -22 -18 -38 0 -30 C18 -40 42 -22 34 0 C40 20 -40 20 -34 0Z" fill="#FFF3C4" stroke="${C.gelap}" stroke-width="6"/></g>
   <g opacity="${1-p(lt,3.1,0.4)}"><path d="M-12 -32 L-60 -250 M12 -32 L60 -250" stroke="${C.gelap}" stroke-width="10" stroke-linecap="round"/></g></g>
  <g opacity="${p(lt,0.2,.3)*(1-p(lt,2.0,.3))}"><text x="800" y="140" class="label" style="font-size:38px">dikeringkan</text><text x="800" y="184" class="label" style="font-size:38px">sedikit dulu</text></g></svg>`;},
// 7 ditutup tambalan sementara, nyeri reda
lt=>{const cap=o4(p(lt,0.3,0.5)), calm=p(lt,2.9,0.8), j=calm<1?Math.sin(lt*38)*3*(1-calm):0;
 const nerve=calm<0.5?`<path transform="translate(${j},0)" d="M-10 -26 L4 -8 L-8 10 L6 28 L-8 46 L4 66" stroke="${C.or}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${1-calm*2}"/>`:`<path d="M0 -26 C-6 0 6 30 0 70" stroke="${C.or}" stroke-width="7" fill="none" stroke-linecap="round" opacity="${(calm-0.5)*2}"/>`;
 return `<div class="h2 abs" style="left:80px;right:140px;top:460px">${lt<2.8?`<span style="opacity:${p(lt,0,.3)}">Ditutup <span class="pill">tambalan sementara</span></span>`:`<span style="opacity:${p(lt,2.8,.25)}">Membantu <span class="pill">meredakan nyeri</span></span>`}</div>
 <svg class="abs" style="left:0;top:740px" width="960" height="620">
  ${tooth(470,330,2.3,`<path d="M-30 -40 C-30 10 -22 60 -30 100 M30 -40 C30 10 22 60 30 100" stroke="${C.ortua}" stroke-width="5" fill="none" opacity=".5"/>${nerve}<path d="M-26 -62 L-18 -30 L18 -30 L26 -62 Z" fill="#FFF3C4" stroke="${C.gelap}" stroke-width="4"/><path d="M-14 -40 C-8 -46 8 -46 14 -40 C10 -34 -10 -34 -14 -40Z" fill="${C.amber}" opacity=".7"/><g transform="translate(0,${-40*(1-cap)})" opacity="${cap}"><path d="M-30 -66 C-12 -54 12 -54 30 -66 L26 -50 C10 -44 -10 -44 -26 -50Z" fill="#D9C7AE" stroke="${C.gelap}" stroke-width="4"/></g>`)}
  <g opacity="${p(lt,0.9,.3)}"><path d="M545 190 L720 110" stroke="${C.gelap}" stroke-width="6" stroke-linecap="round"/><text x="800" y="100" class="label" style="font-size:38px">tambalan</text><text x="800" y="144" class="label" style="font-size:38px">sementara</text></g>
  <g opacity="${p(lt,1.3,.3)}"><path d="M520 240 L720 300" stroke="${C.gelap}" stroke-width="6" stroke-linecap="round"/><text x="800" y="290" class="label" style="font-size:38px">kapas</text><text x="800" y="334" class="label" style="font-size:38px">+ eugenol</text></g></svg>`;},
// 8 aroma menyebar, TERJAWAB
lt=>{const W=[[470,440,.6,0.2],[330,470,.5,0.6],[610,470,.5,0.8],[200,520,.55,1.6],[760,520,.45,1.9],[400,330,.35,2.4],[560,320,.35,2.7]];
 const imp=STAMP3-SC[7], hit=lt>=imp;
 return `<div class="h2 abs" style="left:80px;right:140px;top:460px">${lt<imp-0.1?`<span style="opacity:${p(lt,0,.3)}">Aromanya <span class="pill">menyebar</span></span>`:`<span style="opacity:${p(lt,imp-0.1,.25)}">Itu bau yang <span class="pill">kamu cium</span></span>`}</div>
 <svg class="abs" style="left:0;top:700px" width="960" height="700">
  ${W.map(([x,y,o,t0])=>{const k=p(lt,t0,0.7);return `<g transform="translate(0,${-30*p(lt,t0,6)})" style="clip-path:inset(${100-100*k}% 0 0 0)">${wisp(x,y,o)}</g>`;}).join('')}
  ${tooth(470,580,1.1)}</svg>
 ${hit?`<div class="stamp" style="left:590px;top:1250px;font-size:46px;transform:rotate(-9deg) scale(${1+0.1*(1-p(lt,imp,0.15))})">TERJAWAB</div>`:''}`;},
// 9 berkas #02: kamu yang tentukan
lt=>{const imp=STAMP4-SC[8], hit=lt>=imp;
 return `${folderBlock('BERKAS #02',520,760)}
 <div class="paper" style="left:120px;right:180px;top:580px;height:640px">
  <div class="typed">${typed('RAHASIA #02',p(lt,0.15,0.4))}</div>
  <div style="font-weight:900;font-size:300px;line-height:1;color:${C.ortua};margin-top:10px;display:inline-block;${pop(p(lt,0.5,.35))};transform-origin:30% 60%">?</div></div>
 ${hit?`<div class="stamp" style="left:330px;top:1020px;font-size:58px;transform:rotate(-8deg) scale(${1+0.1*(1-p(lt,imp,0.15))})">KAMU YANG<br>TENTUKAN</div>`:''}`;},
// 10 CTA: tulis di komen, yang paling banyak diminta, follow
lt=>{const tq=LINES[15].s-SC[9], tn=LINES[16].s-SC[9], tf=LINES[17].s-SC[9];
 const hin=o4(p(lt,tq+0.3,0.45)), nudge=lt>tq+0.8&&lt<tq+2.6?Math.max(0,Math.sin((lt-tq-0.8)*Math.PI*2/0.9))*24:0;
 return `<div class="h2 abs" style="left:80px;top:470px;color:${C.ortua};${pop(p(lt,0.15,.3))};transform-origin:0 50%">Tulis di komen</div>
 <div class="cap abs" style="top:590px;opacity:${p(lt,tq,.3)}">Rahasia dokter gigi apa yang mau kamu bongkar?</div>
 <div class="abs" style="left:80px;right:140px;top:760px;font-weight:800;font-size:40px;line-height:1.5;opacity:${p(lt,tn,.3)}">
  <div class="typed" style="font-size:30px;margin-bottom:10px">${typed('YANG PALING BANYAK DIMINTA:',p(lt,tn,0.6))}</div>
  ${lt>tn+0.9?`<span class="pill" style="display:inline-block;${pop(p(lt,tn+0.9,.3))}">dibongkar duluan</span>`:''}</div>
 <div class="h abs" style="left:80px;top:1000px;font-size:80px;opacity:${p(lt,tf,.2)}">${lt>tf?`<span class="pill" style="display:inline-block;${pop(p(lt,tf,.3))}">Follow</span>`:''} biar nggak<br>ketinggalan</div>
 <svg class="abs" style="left:${520-300*(1-hin)+nudge}px;top:1195px;opacity:${hin}" width="440" height="200" viewBox="-290 -120 500 240">${pointHand(0,0,.8)}</svg>`;}
];

const CUTS=[1,2];
const stage=document.getElementById('stage'), subEl=document.getElementById('sub');
function sceneAt(i,t){const s=SC[i], e=i+1<SC.length?SC[i+1]:DURATION;
 // masuk & keluar bertempo sama (partial travel), tanpa jeda kosong di sambungan
 const CUT=[1,2]; // sambungan 0->1 dan 1->2 memakai map yang sama: potong langsung
 const inK=(i===0||CUT.includes(i))?1:o4(p(t,s,0.32)), outK=i+1<SC.length?(CUT.includes(i+1)?(t>=e?1:0):i4(p(t,e,0.28))):0;
 const x=90*(1-inK)-90*outK, op=Math.min(inK,1-outK);
 return `<div class="sc" style="transform:translateX(${x}px);opacity:${op}">${scenes[i](t-s)}</div>`;}
window.render=t=>{let h='';
 for(let i=0;i<SC.length;i++){const s=SC[i], e=i+1<SC.length?SC[i+1]:DURATION; const tail=CUTS.includes(i+1)?0:0.28; if(t>=s-0.001&&t<e+tail) h+=sceneAt(i,t);}
 stage.innerHTML=h;
 const L=LINES.find(l=>t>=l.s-0.05&&t<l.s+l.d+0.15); subEl.innerHTML=L?L.t:'';};
if(!navigator.webdriver){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();}
</script></body></html>
