*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Nunito,sans-serif;color:var(--gelap)}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--krem)}

.folder{position:absolute;background:var(--map);border:5px solid var(--ortua);border-radius:0 26px 26px 26px}

.h{font-weight:900;font-size:86px;line-height:1.12}
.h2{font-weight:900;font-size:72px;line-height:1.15}
.pill{display:inline-block;background:var(--or);color:var(--gelap);padding:0 24px;border-radius:22px}
